<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI検索の出典を確認する方法</title><style>body{font:18px/1.8 system-ui;max-width:44rem;margin:3rem auto;padding:0 1rem;color:#172435;background:#faf9f5}</style><main><article><h1>AI検索の出典を確認する方法</h1><p>回答にURLが載っているかと、そのURLの資料が回答の具体的な主張を支えているかは、別々に記録できます。</p><p>例えば回答が「4月の平均は12」と述べ、資料が「4月の最大は12」と報告している場合、出典表示はありですが、平均値の主張は支えられていません。見比べるときは対象、期間、単位、平均や最大などの集計方法を確認します。</p><p>資料にアクセスできなければ判定不能とし、資料を読んで裏付けが見つからなかった場合と区別すると、集計の分母を明示できます。</p></article><nav><a href="./">研究トップ</a> · <a href="rank-metrics.html">関連する観測ガイド</a></nav></main></html>
