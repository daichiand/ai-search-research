<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>検索順位の評価：Recall@3とMRR</title><style>body{font:18px/1.8 system-ui;max-width:44rem;margin:3rem auto;padding:0 1rem;color:#172435;background:#faf9f5}</style><main><article><h1>検索順位の評価：Recall@3とMRR</h1><h2>上位3件に入った割合</h2><p>各質問に正解資料が1件ある場合、Recall@3は正解資料が上位3件に入った質問の割合です。</p><h2>順位の違い</h2><p>MRRは正解資料の順位の逆数を質問ごとに求めた平均です。正解順位が1位、2位、4位の3問なら、Recall@3は2/3、MRRは7/12です。</p><h2>使い分け</h2><p>検索結果を3件まで後段へ渡す設計ではRecall@3を確認します。最初の候補を優先する設計では、MRRも併記すると、上位3件の中で起きた順位の変化を把握できます。</p></article><nav><a href="./">研究トップ</a> · <a href="citation-evidence.html">関連する観測ガイド</a></nav></main></html>
