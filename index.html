<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI検索の観測研究</title><style>body{font:18px/1.8 system-ui,sans-serif;max-width:46rem;margin:4rem auto;padding:0 1.25rem;color:#172435;background:#faf9f5}h1{line-height:1.2}h2{margin-top:2rem}</style><main><h1>AI検索の観測研究</h1><p>質問の書き方や文書の構造によって、資料の見つかり方や回答に示される出典がどう変わるかを調べる研究サイトです。</p><h2>ローカル予備実験</h2><p>Python標準ライブラリの文書24件を使ったBM25検索で、12問の各2言い換えに対し192試行を行いました。モジュールを明示して対象文書を段落に分けた条件では、正解が24件中17件で1位でした。この集計の範囲は固定したローカル検索環境です。</p><h2>実Webの観測</h2><p>ページにアクセスできるか、索引に登録されたか、AIの回答に出典として示されたかを別々に確認します。このページは観測環境の準備に使います。</p></main></html>
